name: Supplementary Load and Performance Check

on:
  workflow_call:
    secrets:
      K6_ACCESS_TOKEN:
        required: false
      K6_TEST_IDENTIFIER:
        required: false
      K6_TEST_PASSWORD:
        required: false
  push:
    branches: [feature/load-performance-k6-testing, feature/se3112-unified-testing-pipeline]
    paths: ["performance/**", "package.json", ".github/workflows/load-performance.yml"]
  pull_request:
    branches: [Dev]
    paths: ["performance/**", "package.json", ".github/workflows/load-performance.yml"]
  workflow_dispatch:
    inputs:
      profile:
        description: Safe profile for an approved non-production environment
        required: true
        default: load
        type: choice
        options: [smoke, load, stress]
      target_vus:
        description: Base virtual-user count
        required: true
        default: "10"
        type: string
      catalogue_inventory_api_url:
        description: Catalogue/Inventory service base URL
        required: true
        type: string
      auth_api_url:
        description: Auth URL when K6_ACCESS_TOKEN is not configured
        required: false
        type: string
      approval:
        description: Type LOAD_TEST_APPROVED for an authorized non-production target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: catalogue-inventory-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-smoke:
    name: k6 Catalogue/Inventory smoke gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js for deterministic fixtures
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Grafana k6
        uses: grafana/setup-k6-action@v1
      - name: Start deterministic Catalogue/Inventory fixtures
        shell: bash
        run: |
          mkdir -p performance/results
          node performance/fixtures/mock-services.mjs > performance/results/mock-services.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8787/health && exit 0
            sleep 1
          done
          echo "Mock services did not become ready." >&2
          exit 1
      - name: Run supplementary k6 smoke quality gate
        env:
          PROFILE: smoke
          CATALOGUE_INVENTORY_API_URL: http://127.0.0.1:8787
          ACCESS_TOKEN: ci-catalogue-inventory-token
          THINK_TIME_SECONDS: "0"
          P95_MS: "750"
          P99_MS: "1500"
        run: npm run test:performance
      - name: Publish supplementary performance summary
        if: always()
        shell: bash
        run: |
          if [[ -f performance/results/summary.md ]]; then
            cat performance/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Supplementary Load & Performance Check" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplementary-k6-catalogue-inventory-${{ github.run_number }}
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14

  approved-environment-test:
    name: k6 ${{ inputs.profile }} on approved Catalogue/Inventory environment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate safety acknowledgement and credentials
        shell: bash
        env:
          APPROVAL: ${{ inputs.approval }}
          TEST_IDENTIFIER: ${{ secrets.K6_TEST_IDENTIFIER }}
          TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.K6_ACCESS_TOKEN }}
        run: |
          if [[ "$APPROVAL" != "LOAD_TEST_APPROVED" ]]; then
            echo "Manual load testing requires LOAD_TEST_APPROVED." >&2
            exit 1
          fi
          if [[ -z "$ACCESS_TOKEN" && ( -z "$TEST_IDENTIFIER" || -z "$TEST_PASSWORD" ) ]]; then
            echo "Configure K6_ACCESS_TOKEN or both K6_TEST_IDENTIFIER and K6_TEST_PASSWORD." >&2
            exit 1
          fi
      - name: Set up Grafana k6
        uses: grafana/setup-k6-action@v1
      - name: Run approved Catalogue/Inventory profile
        env:
          PROFILE: ${{ inputs.profile }}
          TARGET_VUS: ${{ inputs.target_vus }}
          CATALOGUE_INVENTORY_API_URL: ${{ inputs.catalogue_inventory_api_url }}
          AUTH_API_URL: ${{ inputs.auth_api_url }}
          TEST_IDENTIFIER: ${{ secrets.K6_TEST_IDENTIFIER }}
          TEST_PASSWORD: ${{ secrets.K6_TEST_PASSWORD }}
          ACCESS_TOKEN: ${{ secrets.K6_ACCESS_TOKEN }}
          P95_MS: "1000"
          P99_MS: "2000"
        run: |
          mkdir -p performance/results
          npm run test:performance
      - name: Publish supplementary performance summary
        if: always()
        shell: bash
        run: |
          [[ -f performance/results/summary.md ]] && cat performance/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload k6 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supplementary-k6-${{ inputs.profile }}-${{ github.run_number }}
          path: performance/results/
          if-no-files-found: warn
          retention-days: 30
